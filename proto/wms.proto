syntax = "proto3";

package wns.wms.v1;

service ProductApi {
  rpc CreateProduct(CreateProductRequest) returns (ProductResponse);
  rpc ListProducts(ListProductsRequest) returns (ListProductsResponse);
  rpc GetProduct(GetProductRequest) returns (ProductResponse);
  rpc UpdateProduct(UpdateProductRequest) returns (ProductResponse);
  rpc DeleteProduct(DeleteProductRequest) returns (ProductResponse);
  rpc RestoreProduct(RestoreProductRequest) returns (ProductResponse);
}

service WarehouseApi {
  rpc CreateWarehouse(CreateWarehouseRequest) returns (WarehouseResponse);
  rpc ListWarehouses(ListWarehousesRequest) returns (ListWarehousesResponse);
  rpc GetWarehouse(GetWarehouseRequest) returns (WarehouseResponse);
  rpc UpdateWarehouse(UpdateWarehouseRequest) returns (WarehouseResponse);
  rpc DeleteWarehouse(DeleteWarehouseRequest) returns (WarehouseResponse);
  rpc RestoreWarehouse(RestoreWarehouseRequest) returns (WarehouseResponse);
  rpc CreateWarehouseLocation(CreateWarehouseLocationRequest) returns (WarehouseLocationResponse);
  rpc ListWarehouseLocations(ListWarehouseLocationsRequest) returns (ListWarehouseLocationsResponse);
  rpc GetWarehouseLocation(GetWarehouseLocationRequest) returns (WarehouseLocationResponse);
  rpc UpdateWarehouseLocation(UpdateWarehouseLocationRequest) returns (WarehouseLocationResponse);
  rpc DeleteWarehouseLocation(DeleteWarehouseLocationRequest) returns (WarehouseLocationResponse);
  rpc RestoreWarehouseLocation(RestoreWarehouseLocationRequest) returns (WarehouseLocationResponse);
}

service InboundApi {
  rpc CreateInbound(CreateInboundRequest) returns (InboundResponse);
  rpc ListInbounds(ListInboundsRequest) returns (ListInboundsResponse);
  rpc GetInbound(GetInboundRequest) returns (InboundResponse);
  rpc UpdateInbound(UpdateInboundRequest) returns (InboundResponse);
  rpc CompleteInbound(CompleteInboundRequest) returns (InboundResponse);
  rpc DeleteInbound(DeleteInboundRequest) returns (InboundResponse);
}

service ActivityLogApi {
  rpc ListActivityLogs(ListActivityLogsRequest) returns (ListActivityLogsResponse);
}

service InventoryApi {
  rpc ListInventoryItems(ListInventoryItemsRequest) returns (ListInventoryItemsResponse);
  rpc ListInventoryTransactions(ListInventoryTransactionsRequest) returns (ListInventoryTransactionsResponse);
}

message Product {
  string product_id = 1;
  string sku = 2;
  string product_name = 3;
  string description = 4;
  string category = 5;
  string unit = 6;
  string status = 7;
  string created_by = 8;
  string updated_by = 9;
  string created_at = 10;
  string updated_at = 11;
}

message CreateProductRequest {
  string sku = 1;
  string product_name = 2;
  string description = 3;
  string category = 4;
  string unit = 5;
  string actor_username = 6;
  string actor_user_id = 7;
  string actor_role = 8;
}

message ListProductsRequest {}

message GetProductRequest {
  string product_id = 1;
}

message UpdateProductRequest {
  string product_id = 1;
  string sku = 2;
  string product_name = 3;
  string description = 4;
  string category = 5;
  string unit = 6;
  string actor_username = 7;
  string actor_user_id = 8;
  string actor_role = 9;
}

message DeleteProductRequest {
  string product_id = 1;
  string actor_username = 2;
  string actor_user_id = 3;
  string actor_role = 4;
}

message RestoreProductRequest {
  string product_id = 1;
  string actor_username = 2;
  string actor_user_id = 3;
  string actor_role = 4;
}

message ProductResponse {
  Product product = 1;
}

message ListProductsResponse {
  repeated Product products = 1;
}

message Warehouse {
  string warehouse_id = 1;
  string warehouse_code = 2;
  string warehouse_name = 3;
  string address = 4;
  string status = 5;
  string created_by = 6;
  string updated_by = 7;
  string created_at = 8;
  string updated_at = 9;
}

message WarehouseLocation {
  string location_id = 1;
  string warehouse_id = 2;
  string zone = 3;
  string status = 4;
  string created_by = 5;
  string updated_by = 6;
  string created_at = 7;
  string updated_at = 8;
}

message CreateWarehouseRequest {
  string warehouse_code = 1;
  string warehouse_name = 2;
  string address = 3;
  string actor_username = 4;
  string actor_user_id = 5;
  string actor_role = 6;
}

message ListWarehousesRequest {}

message GetWarehouseRequest {
  string warehouse_id = 1;
}

message UpdateWarehouseRequest {
  string warehouse_id = 1;
  string warehouse_code = 2;
  string warehouse_name = 3;
  string address = 4;
  string actor_username = 5;
  string actor_user_id = 6;
  string actor_role = 7;
}

message DeleteWarehouseRequest {
  string warehouse_id = 1;
  string actor_username = 2;
  string actor_user_id = 3;
  string actor_role = 4;
}

message RestoreWarehouseRequest {
  string warehouse_id = 1;
  string actor_username = 2;
  string actor_user_id = 3;
  string actor_role = 4;
}

message CreateWarehouseLocationRequest {
  string warehouse_id = 1;
  string zone = 2;
  string actor_username = 3;
  string actor_user_id = 4;
  string actor_role = 5;
}

message ListWarehouseLocationsRequest {
  string warehouse_id = 1;
}

message GetWarehouseLocationRequest {
  string location_id = 1;
}

message UpdateWarehouseLocationRequest {
  string location_id = 1;
  string warehouse_id = 2;
  string zone = 3;
  string actor_username = 4;
  string actor_user_id = 5;
  string actor_role = 6;
}

message DeleteWarehouseLocationRequest {
  string location_id = 1;
  string actor_username = 2;
  string actor_user_id = 3;
  string actor_role = 4;
}

message RestoreWarehouseLocationRequest {
  string location_id = 1;
  string actor_username = 2;
  string actor_user_id = 3;
  string actor_role = 4;
}

message WarehouseResponse {
  Warehouse warehouse = 1;
}

message ListWarehousesResponse {
  repeated Warehouse warehouses = 1;
}

message WarehouseLocationResponse {
  WarehouseLocation location = 1;
}

message ListWarehouseLocationsResponse {
  repeated WarehouseLocation locations = 1;
}

message InboundItem {
  string inbound_item_id = 1;
  string inbound_order_id = 2;
  string product_id = 3;
  string location_id = 4;
  int32 actual_qty = 5;
}

message InboundItemInput {
  string product_id = 1;
  string location_id = 2;
  int32 actual_qty = 3;
}

message Inbound {
  string inbound_order_id = 1;
  string inbound_no = 2;
  string warehouse_id = 3;
  string supplier_name = 4;
  string actual_date = 5;
  string status = 6;
  string created_by = 7;
  string created_at = 8;
  string updated_at = 9;
  repeated InboundItem items = 10;
}

message CreateInboundRequest {
  string inbound_no = 1;
  string warehouse_id = 2;
  string supplier_name = 3;
  string actual_date = 4;
  repeated InboundItemInput items = 5;
  string actor_username = 6;
  string actor_user_id = 7;
  string actor_role = 8;
}

message ListInboundsRequest {}

message GetInboundRequest {
  string inbound_order_id = 1;
}

message UpdateInboundRequest {
  string inbound_order_id = 1;
  string inbound_no = 2;
  string warehouse_id = 3;
  string supplier_name = 4;
  string actual_date = 5;
  repeated InboundItemInput items = 6;
  string actor_username = 7;
  string actor_user_id = 8;
  string actor_role = 9;
}

message CompleteInboundRequest {
  string inbound_order_id = 1;
  string actor_username = 2;
  string actor_user_id = 3;
  string actor_role = 4;
}

message DeleteInboundRequest {
  string inbound_order_id = 1;
  string actor_username = 2;
  string actor_user_id = 3;
  string actor_role = 4;
}

message InboundResponse {
  Inbound inbound = 1;
}

message ListInboundsResponse {
  repeated Inbound inbounds = 1;
}

message ActivityLog {
  string log_id = 1;
  string user_id = 2;
  string username = 3;
  string action = 4;
  string reference_type = 5;
  string reference_id = 6;
  string description = 7;
  string created_at = 8;
}

message ListActivityLogsRequest {
  int32 page = 1;
}

message ListActivityLogsResponse {
  repeated ActivityLog activity_logs = 1;
  int32 page = 2;
  int32 page_size = 3;
  int32 total_items = 4;
  int32 total_pages = 5;
}

message InventoryItem {
  string inventory_id = 1;
  string warehouse_id = 2;
  string warehouse_code = 3;
  string warehouse_name = 4;
  string location_id = 5;
  string location_zone = 6;
  string product_id = 7;
  string product_sku = 8;
  string product_name = 9;
  string product_unit = 10;
  int32 quantity = 11;
  string updated_at = 12;
}

message ListInventoryItemsRequest {
  string warehouse_id = 1;
}

message ListInventoryItemsResponse {
  repeated InventoryItem inventory_items = 1;
}

message InventoryTransaction {
  string transaction_id = 1;
  string product_id = 2;
  string product_sku = 3;
  string product_name = 4;
  string product_unit = 5;
  string warehouse_id = 6;
  string warehouse_code = 7;
  string warehouse_name = 8;
  string location_id = 9;
  string location_zone = 10;
  string transaction_type = 11;
  int32 quantity = 12;
  string reference_no = 13;
  string created_by = 14;
  string created_at = 15;
}

message ListInventoryTransactionsRequest {
  int32 page = 1;
}

message ListInventoryTransactionsResponse {
  repeated InventoryTransaction inventory_transactions = 1;
  int32 page = 2;
  int32 page_size = 3;
  int32 total_items = 4;
  int32 total_pages = 5;
}
