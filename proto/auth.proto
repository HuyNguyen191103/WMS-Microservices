syntax = "proto3";

package wns.auth.v1;

option java_multiple_files = true;
option java_package = "com.example.auth.grpc.proto";
option java_outer_classname = "AuthProto";

service AuthApi {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Login(LoginRequest) returns (AuthResponse);
  rpc GetMe(GetMeRequest) returns (GetMeResponse);
}

message RegisterRequest {
  string username = 1;
  string mail = 2;
  string password = 3;
  string phone_number = 4;
  string address = 5;
  string department = 6;
}

message LoginRequest {
  string mail = 1;
  string password = 2;
}

message RegisterResponse {
  UserInfo user = 1;
}

message AuthResponse {
  string access_token = 1;
  int64 expired = 2;
}

message GetMeRequest {
  string user_id = 1;
}

message GetMeResponse {
  UserInfo user = 1;
}

message UserInfo {
  string user_id = 1;
  string username = 2;
  string mail = 3;
  string status = 4;
  UserProfile profile = 5;
  repeated Role roles = 6;
}

message UserProfile {
  string profile_id = 1;
  string phone_number = 2;
  string address = 3;
  string department = 4;
}

message Role {
  string role_id = 1;
  string role_name = 2;
  string description = 3;
}
